<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Consultar Comprobante | Kipu Ecuador</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/styles.css">
    <!-- NOTA: todos los estilos de esta página ahora viven en styles.css -->
    <!-- bajo la sección "PÁGINA CONSULTA — FIXES RESPONSIVE" -->
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">
                <i class="fa-solid fa-file-invoice-dollar"></i>
                <span>Kipu</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">Volver al Inicio</a>
            </div>
        </div>
    </nav>

    <main class="search-page">
        <div class="container">
            <div class="search-container">
                <div class="section-header" style="margin-bottom: 2rem;">
                    <h1>Consulta tu Factura</h1>
                    <p>Ingresa la clave de acceso de 49 dígitos generada por el SRI.</p>
                </div>

                <div class="search-box">
                    <input
                        type="text"
                        id="claveInput"
                        class="clave-input"
                        maxlength="49"
                        placeholder="0000000000000000000000000000000000000000000000000"
                        inputmode="numeric"
                        autocomplete="off"
                        autocorrect="off"
                        spellcheck="false"
                    >
                    
                    <button id="btnConsultar" class="btn btn-primary" style="width: 100%; height: 55px; font-size: 1.1rem;">
                        <i class="fa-solid fa-magnifying-glass"></i> Buscar Comprobante
                    </button>
                    <div style="opacity: 0; position: absolute; top: 0; left: 0; height: 0; width: 0; z-index: -1;">
                        <input type="text" id="email_contacto_hp" name="email_contacto_hp" tabindex="-1" autocomplete="off">
                    </div>
                
                    <div id="turnstile-container" style="margin: 1.5rem 0; display: flex; justify-content: center;">
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAACtVpZB4n7hO4IQd"></div>
                    </div>
                    <div id="loader" class="loader"></div>

                    <div id="resultadoArea">
                        <hr style="margin: 2rem 0; border: 0; border-top: 1px solid var(--gray-200);">
                        
                        <div id="statusBadge" class="status-badge"></div>
                        <h3 id="emisorNombre" style="margin-bottom: 0.5rem;"></h3>
                        <p id="infoFactura" style="color: var(--gray-600); margin-bottom: 1.5rem;"></p>
                        
                        <div id="mensajeUsuario" style="margin-bottom: 1.5rem; padding: 1rem; border-radius: 8px; font-size: 0.95rem;"></div>

                        <div id="descargasArea">
                            <a id="linkPdf" href="#" target="_blank" class="btn btn-outline" style="color: #ef4444; border-color: #ef4444;">
                                <i class="fa-solid fa-file-pdf"></i> PDF
                            </a>
                            <a id="linkXml" href="#" target="_blank" class="btn btn-outline">
                                <i class="fa-solid fa-file-code"></i> XML
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" style="padding: 3rem 0;">
        <div class="container" style="text-align: center;">
            <p>&copy; 2026 Kipu Ecuador. Servicio público de consulta.</p>
        </div>
    </footer>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="js/consulta.js"></script>
</body>
</html>
